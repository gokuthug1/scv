<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Source Code Viewer</title>

  <link rel="icon" type="image/png" href="images/v.png">

  <style id="theme-styles"></style>

  <link rel="stylesheet" href="css/viewer.css">

  <style id="custom-user-css"></style>

</head>

<body>



  <header>

    <div class="header-left">

      <div class="app-icon" data-tooltip="Source Code Viewer Workspace">

        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          <polyline points="16 18 22 12 16 6"></polyline>

          <polyline points="8 6 2 12 8 18"></polyline>

        </svg>

      </div>

      <div class="header-info">

        <div class="title-badge-row">

          <h1 id="page-title">Loading workspace...</h1>

          <div id="framework-badges" class="framework-badges"></div>

        </div>

        <p id="page-url">...</p>

      </div>

    </div>



    <div class="header-center" id="tab-selector-container" style="display: none;">

      <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="selector-icon">

        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>

        <line x1="9" y1="3" x2="9" y2="21"></line>

      </svg>

      <select id="tab-select" class="tab-select-dropdown" aria-label="Select inspectable tab"></select>

      <button id="refresh-tab-btn" class="icon-action-btn" data-tooltip="Refresh Current Page Sources" aria-label="Refresh Current Page Sources">

        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <polyline points="23 4 23 10 17 10"></polyline>

          <polyline points="1 20 1 14 7 14"></polyline>

          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>

        </svg>

      </button>

    </div>



    <div class="header-actions">

      <div id="header-asset-actions" class="header-asset-actions"></div>



      <button id="download-btn" class="action-btn primary-btn">

        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>

          <polyline points="7 10 12 15 17 10"></polyline>

          <line x1="12" y1="15" x2="12" y2="3"></line>

        </svg>

        <span>Download .zip</span>

      </button>

    </div>

  </header>



  <div class="main-container">

    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="sidebar-tabs">

          <button id="tab-files-btn" class="sidebar-tab-btn active">Files</button>

          <button id="tab-secrets-btn" class="sidebar-tab-btn">Secrets <span id="secrets-badge" class="badge">0</span></button>

          <button id="tab-grep-btn" class="sidebar-tab-btn">Grep</button>

        </div>

        <button id="toggle-view-btn" class="icon-toggle-btn" data-tooltip="Toggle Tree / Flat View" aria-label="Toggle Tree / Flat View">

          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>

        </button>

      </div>



      <div id="file-list" class="file-list sidebar-panel active"></div>



      <div id="secrets-panel" class="sidebar-panel">

        <div class="panel-inner" id="secrets-list">

          <p class="empty-msg">No credentials scanned yet.</p>

        </div>

      </div>



      <div id="grep-panel" class="sidebar-panel">

        <div class="grep-search-box">

          <input type="text" id="grep-input" placeholder="Search across all files (text or regex)..." aria-label="Search across files" />

        </div>

        <div class="panel-inner" id="grep-results">

          <p class="empty-msg">Type search query above.</p>

        </div>

      </div>

    </aside>



    <main class="editor-area">

      <div id="welcome-message" class="welcome-screen">

        <div class="welcome-icon-wrapper">

          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="welcome-icon">

            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>

            <line x1="3" y1="9" x2="21" y2="9"></line>

            <line x1="9" y1="21" x2="9" y2="9"></line>

          </svg>

        </div>

        <h2>Select a file to inspect source code</h2>

        <p>Choose HTML, CSS, JavaScript, or media assets from the explorer sidebar.</p>

      </div>



      <div id="code-container" style="display: none;">

        <div class="editor-toolbar">

          <div class="file-info-group">

            <span id="current-file-path">filename.js</span>

            <span id="current-file-size" class="file-size-badge">0 B</span>

            <span id="current-file-lines" class="file-size-badge line-count-badge" style="display: none;"></span>

            <span id="css-coverage-badge" class="file-size-badge coverage-badge" style="display: none;"></span>

          </div>



          <div class="toolbar-actions" id="viewer-toolbar-actions">

            <button id="find-in-file-btn" class="icon-action-btn" data-tooltip="Find in file (Ctrl+F)" aria-label="Find in file">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <circle cx="11" cy="11" r="8"></circle>

                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

              </svg>

            </button>



            <button id="open-new-tab-btn" class="icon-action-btn" data-tooltip="Open in new tab" aria-label="Open in new tab" style="display: none;">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>

                <polyline points="15 3 21 3 21 9"></polyline>

                <line x1="10" y1="14" x2="21" y2="3"></line>

              </svg>

            </button>



            <button id="beautify-code-btn" class="icon-action-btn" data-tooltip="Beautify / Format Code" aria-label="Format Code">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72z"></path><line x1="14" y1="7" x2="17" y2="10"></line></svg>

            </button>



            <button id="copy-code-btn" class="icon-action-btn" data-tooltip="Copy Code" aria-label="Copy Code">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>

                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>

              </svg>

            </button>



            <button id="single-download-btn" class="icon-action-btn" data-tooltip="Download File" aria-label="Download File">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

            </button>



            <button id="live-preview-btn" class="toolbar-pill-btn accent-pill" data-tooltip="Run Live Preview">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>

              <span>Live Preview</span>

            </button>



            <button id="diff-snapshot-btn" class="toolbar-pill-btn" data-tooltip="Diff against Page Snapshot">

              <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>

              <span>Diff Snapshot</span>

            </button>



            <div class="dropdown-wrapper">

              <button id="export-dropdown-btn" class="toolbar-pill-btn" data-tooltip="Export to IDE / Cloud">

                <span>Export</span>

                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;"><polyline points="6 9 12 15 18 9"></polyline></svg>

              </button>

              <div id="export-menu" class="dropdown-menu" style="display: none;">

                <button id="export-vscode-btn">

                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>

                  VS Code Desktop

                </button>

                <button id="export-vscodedev-btn">

                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>

                  VS Code Web (vscode.dev)

                </button>

                <button id="export-codepen-btn">

                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"></polygon><line x1="12" y1="22" x2="12" y2="15.5"></line><polyline points="22 8.5 12 15.5 2 8.5"></polyline><polyline points="2 15.5 12 8.5 22 15.5"></polyline><line x1="12" y1="2" x2="12" y2="8.5"></line></svg>

                  CodePen

                </button>

                <button id="export-jsfiddle-btn">

                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>

                  JSFiddle

                </button>

                <button id="export-stackblitz-btn">

                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>

                  StackBlitz

                </button>

                <button id="export-gist-btn">

                  <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>

                  GitHub Gist

                </button>

              </div>

            </div>

          </div>

        </div>



        <div id="asset-preview-container" class="asset-preview-panel" style="display: none;"></div>



        <div class="code-scroll-area" id="code-scroll-container">

          <pre><code id="code-content"></code></pre>

        </div>

      </div>

    </main>

  </div>



  <div id="live-preview-modal" class="modal-overlay" style="display: none;">

    <div class="modal-card">

      <div class="modal-header">

        <div class="modal-title-group">

          <span class="modal-dot red"></span>

          <span class="modal-dot yellow"></span>

          <span class="modal-dot green"></span>

          <h3>Live Sandbox Preview</h3>

        </div>

        <button id="close-live-preview-btn" class="close-modal-btn" aria-label="Close Preview">

          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

        </button>

      </div>

      <div class="modal-body">

        <iframe id="live-sandbox-iframe" sandbox="allow-scripts allow-modals"></iframe>

      </div>

    </div>

  </div>



  <div id="diff-modal" class="modal-overlay" style="display: none;">

    <div class="modal-card">

      <div class="modal-header">

        <div class="modal-title-group">

          <span class="modal-dot red"></span>

          <span class="modal-dot yellow"></span>

          <span class="modal-dot green"></span>

          <h3>Local Snapshot Difference</h3>

        </div>

        <div style="display: flex; align-items: center; gap: 8px;">

          <button id="update-snapshot-btn" class="toolbar-pill-btn" data-tooltip="Overwrite saved snapshot with current page state">

            <span>Update Baseline</span>

          </button>

          <button id="close-diff-modal-btn" class="close-modal-btn" aria-label="Close Diff">

            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

          </button>

        </div>

      </div>

      <div class="modal-body" id="diff-modal-body"></div>

    </div>

  </div>



  <script src="js/db.js"></script>

  <script src="js/zip.js"></script>

  <script src="js/themes.js"></script>

  <script src="js/beautifier.js"></script>

  <script src="js/highlighter.js"></script>

  <script src="js/secret-scanner.js"></script>

  <script src="js/framework-detector.js"></script>

  <script src="js/sourcemap-resolver.js"></script>

  <script src="js/editor-engine.js"></script>

  <script src="js/snapshot-diff.js"></script>

  <script src="js/export-integrations.js"></script>

  <script src="js/file-utils.js"></script>

  <script src="js/viewer.js"></script>

</body>

</html>
